[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyramz"
dynamic = ["version"]
description = "Original, duotone-ready SVG icons for Python: web templates, Jupyter, CLI and sprites."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "karawash-projects", email = "287877668+karawash-projects@users.noreply.github.com" }]
requires-python = ">=3.9"
dependencies = []
keywords = ["icons", "svg", "icon-set", "duotone", "ui", "jinja", "django", "flask", "fastapi", "jupyter"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Framework :: Django",
  "Framework :: Flask",
  "Framework :: Jupyter",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Software Development :: User Interfaces",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/karawash-projects/pyramz"
Documentation = "https://github.com/karawash-projects/pyramz#readme"
Gallery = "https://karawash-projects.github.io/pyramz/"
Issues = "https://github.com/karawash-projects/pyramz/issues"
Changelog = "https://github.com/karawash-projects/pyramz/blob/main/CHANGELOG.md"

[project.optional-dependencies]
png = ["cairosvg>=2.7"]
dev = ["pytest>=7", "pytest-cov>=4", "ruff==0.17.6", "build>=1", "twine>=5"]
docs = ["cairosvg>=2.7", "pillow>=10"]

[project.scripts]
pyramz = "pyramz.cli:entry"

[tool.setuptools.dynamic]
version = { attr = "pyramz.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pyramz = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["pyramz"]

[tool.ruff]
line-length = 120
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "E731"]

[tool.ruff.lint.per-file-ignores]
# icon definitions are long, declarative, single-letter helpers by design
"src/pyramz/_registry.py" = ["E741"]
